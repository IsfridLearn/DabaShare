<div style="font-family: Arial, Helvetica, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #1f2937;">
  <h2 style="color: #2563eb; margin: 0 0 16px;">Confirm your new email</h2>
  <p>Confirm that you want to use {{ .NewEmail }} for your DabaShare account.</p>
  <p style="margin: 24px 0;">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email_change&next=/settings"
       style="background: #2563eb; color: #ffffff; padding: 12px 20px; border-radius: 8px; text-decoration: none; font-weight: bold;">
      Confirm new email
    </a>
  </p>
  <p style="font-size: 13px; color: #6b7280;">If you didn't request this change, ignore this email and consider resetting your password.</p>
</div>
