<div style="font-family: Arial, Helvetica, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #1f2937;">
  <h2 style="color: #2563eb; margin: 0 0 16px;">Reset your DabaShare password</h2>
  <p>We received a request to reset the password for your account.</p>
  <p style="margin: 24px 0;">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
       style="background: #2563eb; color: #ffffff; padding: 12px 20px; border-radius: 8px; text-decoration: none; font-weight: bold;">
      Choose a new password
    </a>
  </p>
  <p style="font-size: 13px; color: #6b7280;">This link expires in 1 hour. If you didn't ask for a reset, ignore this email; your password stays the same.</p>
</div>
